# Continuous integration gate for the Agent Discussion Room.
#
# Mirrors the local verification contract (docs/verification.md) exactly:
# the frozen Bun lockfile is installed and the same package scripts that
# maintainers run locally (lint, typecheck, test, audit, build) gate every
# push, followed by the deterministic credential-free browser suite.
#
# Nothing here requires provider credentials or makes live model calls:
# unit/integration tests run in-memory, the browser suite runs the
# deterministic generation adapter, and the audit compares the lockfile
# against upstream advisory data.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, type, test, audit, build, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          # Must match the `packageManager` and `engines.bun` pins so local
          # and CI runs resolve identically.
          bun-version: 1.3.14

      - name: Install dependencies from the frozen lockfile
        run: bun install --frozen-lockfile

      # The aggregate script runs lint, strict type checking, unit and
      # integration tests, the dependency audit gate, and the production
      # build — the same commands documented for local use. `&&` chaining
      # means any failing command fails the job with its own output.
      - name: Run the aggregate verification script
        run: bun run verify

      - name: Install the Chromium browser for the deterministic suite
        run: bunx playwright install --with-deps chromium

      - name: Run the deterministic browser suite
        run: bun run test:browser
